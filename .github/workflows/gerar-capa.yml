name: Gerar capa

on:
  push:
    paths:
      - "entrada/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-capa
  cancel-in-progress: false

jobs:
  capa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests pyshp
      - name: Gerar imagens
        run: python scripts/gerar_capa.py
      - name: Salvar resultado
        run: |
          git config user.name "gerador-capa"
          git config user.email "actions@users.noreply.github.com"
          git add saida
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Capas geradas"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
