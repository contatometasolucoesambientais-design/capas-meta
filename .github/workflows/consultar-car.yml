name: Consultar CAR

on:
  push:
    paths:
      - "car/**"
      - "scripts/geoportal_kml.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-capa
  cancel-in-progress: false

jobs:
  car:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Baixar KML pelo Geoportal
        run: python scripts/geoportal_kml.py || true
      - name: Salvar resultado
        run: |
          git config user.name "consulta-car"
          git config user.email "actions@users.noreply.github.com"
          git add saida/car entrada
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Consulta CAR"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
